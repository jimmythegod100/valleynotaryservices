<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Valley Notary Services</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://valleynotaryservices.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f172a;
      --gold: #d97706;
      --slate: #f8fafc;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Manrope", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      color: var(--slate);
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
      padding: 2rem 2rem 5.5rem;
    }
    .panel { width: min(100%, 36rem); text-align: center; }
    .brand {
      display: block;
      width: min(14rem, 70vw);
      margin: 0 auto 1.75rem;
      padding: 0.75rem 0.9rem;
      background: #ececec;
      line-height: 0;
    }
    .brand img { width: 100%; height: auto; }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1.75rem;
      color: rgba(248, 250, 252, 0.82);
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.25rem;
      background: var(--gold);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      min-height: 44px;
    }
    a.btn:hover { background: #b45309; }
    a.btn-ghost {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.45);
    }
    a.btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--navy);
      color: rgba(248, 250, 252, 0.62);
      padding: 1rem 1.25rem;
      font-size: 0.85rem;
      line-height: 1.5;
      text-align: center;
    }
    .site-footer p { margin: 0; color: rgba(248, 250, 252, 0.62); }
  </style>
</head>
<body>
  <div class="panel">
    <a class="brand" href="/">
      <img src="/images/logo-light.png" alt="Valley Notary Services" width="413" height="267" decoding="async" />
    </a>
    <h1>Page not found</h1>
    <p>That link doesn’t exist. Head back to the homepage to request a mobile notary appointment, or call us directly.</p>
    <div class="actions">
      <a class="btn" href="/">Back to homepage</a>
      <a class="btn btn-ghost" href="tel:+12093155702">(209) 315-5702</a>
    </div>
  </div>
  <footer class="site-footer">
    <p>&copy; 2026 Martinez Enterprises. All rights reserved. Valley Notary Services is a service of Martinez Enterprises.</p>
  </footer>
</body>
</html>
