<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Valley Notary Services</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://valleynotaryservices.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f172a;
      --gold: #d97706;
      --gold-soft: #fbbf24;
      --slate: #f8fafc;
      --muted: #475569;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Manrope", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--font-body);
      color: var(--slate);
      background:
        linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
      padding: 2rem;
    }
    .panel {
      width: min(100%, 36rem);
      text-align: center;
    }
    .brand {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--gold-soft);
      margin: 0 0 1.5rem;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1.75rem;
      color: rgba(248, 250, 252, 0.82);
      line-height: 1.6;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.25rem;
      background: var(--gold);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
    }
    a.btn:hover { background: #b45309; }
  </style>
</head>
<body>
  <div class="panel">
    <p class="brand">Valley Notary Services</p>
    <h1>Page not found</h1>
    <p>That link doesn’t exist. Head back to the homepage to request a mobile notary appointment in Modesto and the Central Valley.</p>
    <a class="btn" href="/">Back to homepage</a>
  </div>
</body>
</html>
